<?xml version="1.0" encoding="UTF-8"?>
<!-- visaomodernidade — SVG sprite com ícones epistêmicos e de navegação.
     Uso: <svg><use href="assets/icons.svg#icon-check"></use></svg>
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
  <!-- ✓ Documentado -->
  <symbol id="icon-check" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M8 12.5l3 3 5-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- ★ Identificado -->
  <symbol id="icon-star" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2"/>
    <path d="M12 6.5l1.8 3.7 4 .6-2.9 2.8.7 4-3.6-1.9-3.6 1.9.7-4-2.9-2.8 4-.6z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
  </symbol>

  <!-- ≈ Inferido -->
  <symbol id="icon-approx" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 2"/>
    <path d="M7 10c1.5-1.5 3-1.5 5 0s3.5 1.5 5 0M7 14c1.5-1.5 3-1.5 5 0s3.5 1.5 5 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- ? Hipótese -->
  <symbol id="icon-hypothesis" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 3"/>
    <path d="M9.5 9c0-1.4 1.1-2.5 2.5-2.5s2.5 1.1 2.5 2.5c0 1-.5 1.5-1.2 2-.7.5-1.3 1-1.3 2v.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <circle cx="12" cy="17" r="1" fill="currentColor"/>
  </symbol>

  <!-- ⚠ Problemático -->
  <symbol id="icon-warning" viewBox="0 0 24 24">
    <path d="M12 3l10 17H2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M12 10v5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="12" cy="18" r="1" fill="currentColor"/>
  </symbol>

  <!-- — Não identificado -->
  <symbol id="icon-unknown" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M8 12h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- → Seta direita -->
  <symbol id="icon-arrow-right" viewBox="0 0 24 24">
    <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- ↓ Seta baixo -->
  <symbol id="icon-arrow-down" viewBox="0 0 24 24">
    <path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- ✕ Fechar -->
  <symbol id="icon-close" viewBox="0 0 24 24">
    <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- ☰ Menu -->
  <symbol id="icon-menu" viewBox="0 0 24 24">
    <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- 📖 Livro/Folheto -->
  <symbol id="icon-book" viewBox="0 0 24 24">
    <path d="M4 4h7v16H4zM13 4h7v16h-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M4 8h7M13 8h7M4 16h7M13 16h7" fill="none" stroke="currentColor" stroke-width="1"/>
  </symbol>

  <!-- 🔗 Link/relação -->
  <symbol id="icon-link" viewBox="0 0 24 24">
    <path d="M9 12a3 3 0 0 1 3-3h3M15 12a3 3 0 0 1-3 3H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M6 12a6 6 0 0 1 6-6M18 12a6 6 0 0 1-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2"/>
  </symbol>

  <!-- 📄 Documento/Página -->
  <symbol id="icon-doc" viewBox="0 0 24 24">
    <path d="M6 2h8l4 4v16H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M14 2v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </symbol>

  <!-- 🏛️ Instituição/periódico -->
  <symbol id="icon-periodical" viewBox="0 0 24 24">
    <path d="M4 20V8M20 20V8M4 20h16M4 8h16M8 8V4M12 8V4M16 8V4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>
