[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visaomodernidade"
version = "0.4.0"
description = "Pacote de dados acadêmicos versionados sobre a presença britânica no Gabinete de Leitura (1837-1838), extraído da tese de Maria Angélica Lau Pereira Soares (2006)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Equipe Visão da Modernidade", email = "noreply@example.com" }
]
keywords = ["humanities-digital", "bibliografia-historica", "gabinete-de-leitura", "provenancia-textual", "json-schema"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Humanities",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5,<6",
]
site = [
    # Reservado para dependências do front-end estático, se necessário.
]

[project.urls]
Homepage = "https://github.com/danzeroum/visaomodernidade"
Documentation = "https://github.com/danzeroum/visaomodernidade/blob/main/docs/README.md"
Repository = "https://github.com/danzeroum/visaomodernidade"
Issues = "https://github.com/danzeroum/visaomodernidade/issues"
Source = "Soares, Maria Angélica Lau Pereira (2006). Visão da Modernidade. USP/FFLCH."

[project.scripts]
visaomodernidade-build = "visaomodernidade.cli:build"
visaomodernidade-validate = "visaomodernidade.cli:validate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--showlocals",
]

[tool.coverage.run]
source = ["visaomodernidade"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
